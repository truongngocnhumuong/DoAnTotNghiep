{% if messages %}
<div class="messages-container mb-3" aria-live="polite" aria-atomic="false">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-start gap-2"
         role="alert">
        {# Icon theo loại thông báo #}
        {% if message.tags == 'success' %}
            <i class="bi bi-check-circle-fill flex-shrink-0 mt-1"></i>
        {% elif message.tags == 'danger' %}
            <i class="bi bi-x-circle-fill flex-shrink-0 mt-1"></i>
        {% elif message.tags == 'warning' %}
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 mt-1"></i>
        {% elif message.tags == 'info' %}
            <i class="bi bi-info-circle-fill flex-shrink-0 mt-1"></i>
        {% else %}
            <i class="bi bi-bell-fill flex-shrink-0 mt-1"></i>
        {% endif %}
        <div class="flex-grow-1">{{ message }}</div>
        <button type="button" class="btn-close flex-shrink-0" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
